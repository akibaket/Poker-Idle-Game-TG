<body class="flex justify-center items-center min-h-screen bg-slate-950">

    <div id="root" class="w-full h-full flex justify-center items-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Sound Synthesis Utility (Web Audio API)
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    osc.frequency.setValueAtTime(1046.50, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'fuse') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(1200, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'lose') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(150, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        };

        // Rarity Definitions
        const RARITIES = [
            { id: 'common', name: 'COMMON', color: 'text-slate-300', bg: 'bg-slate-800', border: 'border-slate-500', mult: 1, fuseCost: 2000, next: 'uncommon' },
            { id: 'uncommon', name: 'UNCOMMON', color: 'text-emerald-400', bg: 'bg-emerald-950', border: 'border-emerald-500', mult: 2, fuseCost: 4000, next: 'rare' },
            { id: 'rare', name: 'RARE', color: 'text-blue-400', bg: 'bg-blue-950', border: 'border-blue-500', mult: 4, fuseCost: 8000, next: 'epic' },
            { id: 'epic', name: 'EPIC', color: 'text-purple-400', bg: 'bg-purple-950', border: 'border-purple-500', mult: 8, fuseCost: 16000, next: 'legendary' },
            { id: 'legendary', name: 'LEGENDARY', color: 'text-amber-400', bg: 'bg-amber-950', border: 'border-amber-500', mult: 16, fuseCost: 32000, next: 'mythic' },
            { id: 'mythic', name: 'MYTHIC', color: 'text-rose-400', bg: 'bg-rose-950', border: 'border-rose-500', mult: 32, fuseCost: 0, next: null }
        ];

        // Suits Definition
        const SUITS = [
            { id: 'hearts', symbol: '♥', color: 'text-red-500', name: 'Hearts', isRed: true },
            { id: 'diamonds', symbol: '♦', color: 'text-red-500', name: 'Diamonds', isRed: true },
            { id: 'clubs', symbol: '♣', color: 'text-slate-200', name: 'Clubs', isRed: false },
            { id: 'spades', symbol: '♠', color: 'text-slate-200', name: 'Spades', isRed: false }
        ];

        // Ranks Data
        const RANKS_DATA = [
            { name: '2', coinValue: 2, pokerRank: 2 },
            { name: '3', coinValue: 3, pokerRank: 3 },
            { name: '4', coinValue: 4, pokerRank: 4 },
            { name: '5', coinValue: 5, pokerRank: 5 },
            { name: '6', coinValue: 6, pokerRank: 6 },
            { name: '7', coinValue: 7, pokerRank: 7 },
            { name: '8', coinValue: 8, pokerRank: 8 },
            { name: '9', coinValue: 9, pokerRank: 9 },
            { name: '10', coinValue: 10, pokerRank: 10 },
            { name: 'J', coinValue: 12, pokerRank: 11 },
            { name: 'Q', coinValue: 15, pokerRank: 12 },
            { name: 'K', coinValue: 20, pokerRank: 13 },
            { name: 'A', coinValue: 25, pokerRank: 14 }
        ];

        // Helper to create a card object
        function getRandomCard(forcedRarity = null) {
            const suitObj = SUITS[Math.floor(Math.random() * SUITS.length)];
            const rankObj = RANKS_DATA[Math.floor(Math.random() * RANKS_DATA.length)];
            
            let rarity = forcedRarity;
            if (!rarity) {
                const rand = Math.random();
                if (rand < 0.55) rarity = 'common';
                else if (rand < 0.80) rarity = 'uncommon';
                else if (rand < 0.93) rarity = 'rare';
                else if (rand < 0.98) rarity = 'epic';
                else if (rand < 0.998) rarity = 'legendary';
                else rarity = 'mythic';
            }

            return {
                id: Math.random().toString(36).substring(2, 9) + Date.now(),
                suit: suitObj.id,
                symbol: suitObj.symbol,
                rankName: rankObj.name,
                coinValue: rankObj.coinValue,
                pokerRank: rankObj.pokerRank,
                rarity: rarity
            };
        }

        // Helper function to generate 5 strictly unique cards (no duplicate Rank + Suit)
        function generateUniqueHand() {
            const hand = [];
            const usedKeys = new Set();
            while (hand.length < 5) {
                const card = getRandomCard();
                const key = `${card.rankName}-${card.suit}`;
                if (!usedKeys.has(key)) {
                    usedKeys.add(key);
                    hand.push(card);
                }
            }
            return hand;
        }

        // Evaluate Poker Hand Hierarchy
        function getPokerHandDetails(cards) {
            if (!cards || cards.length !== 5) {
                return { handName: 'INCOMPLETE HAND', categoryRank: 0, mult: 1 };
            }

            const ranks = cards.map(c => c.pokerRank).sort((a, b) => b - a);
            const suits = cards.map(c => c.suit);

            const rankCounts = {};
            ranks.forEach(r => rankCounts[r] = (rankCounts[r] || 0) + 1);

            const counts = Object.values(rankCounts).sort((a, b) => b - a);
            const isFlush = suits.every(s => s === suits[0]);
            
            let isStraight = false;
            let straightHigh = 0;
            const uniqueRanks = [...new Set(ranks)].sort((a, b) => b - a);
            
            if (uniqueRanks.length === 5) {
                if (uniqueRanks[0] - uniqueRanks[4] === 4) {
                    isStraight = true;
                    straightHigh = uniqueRanks[0];
                } else if (uniqueRanks[0] === 14 && uniqueRanks[1] === 5 && uniqueRanks[2] === 4 && uniqueRanks[3] === 3 && uniqueRanks[4] === 2) {
                    isStraight = true;
                    straightHigh = 5;
                }
            }

            if (isFlush && isStraight) {
                if (straightHigh === 14) return { handName: 'ROYAL FLUSH', categoryRank: 10, mult: 50 };
                return { handName: 'STRAIGHT FLUSH', categoryRank: 9, mult: 25 };
            }
            if (counts[0] === 4) return { handName: 'FOUR OF A KIND', categoryRank: 8, mult: 15 };
            if (counts[0] === 3 && counts[1] === 2) return { handName: 'FULL HOUSE', categoryRank: 7, mult: 10 };
            if (isFlush) return { handName: 'FLUSH', categoryRank: 6, mult: 7 };
            if (isStraight) return { handName: 'STRAIGHT', categoryRank: 5, mult: 5 };
            if (counts[0] === 3) return { handName: 'THREE OF A KIND', categoryRank: 4, mult: 3 };
            if (counts[0] === 2 && counts[1] === 2) return { handName: 'TWO PAIR', categoryRank: 3, mult: 2 };
            if (counts[0] === 2) return { handName: 'ONE PAIR', categoryRank: 2, mult: 1.5 };

            return { handName: 'HIGH CARD', categoryRank: 1, mult: 1 };
        }

        function comparePokerHands(handA, handB) {
            return handA.categoryRank - handB.categoryRank;
        }

        // Auto-fit function: Prioritizes poker hand hierarchy over raw coin values
        function findBestHandCombination(allCards) {
            const uniqueMap = {};
            allCards.forEach(c => {
                const key = `${c.rankName}-${c.suit}`;
                const rarityMult = RARITIES.find(r => r.id === c.rarity)?.mult || 1;
                const score = c.pokerRank * 10 + rarityMult;
                if (!uniqueMap[key] || score > uniqueMap[key].score) {
                    uniqueMap[key] = { card: c, score };
                }
            });

            let pool = Object.values(uniqueMap).map(i => i.card);
            if (pool.length <= 5) return pool;

            function getCombinations(arr, k) {
                if (k === 0) return [[]];
                if (arr.length === 0) return [];
                const head = arr[0];
                const tail = arr.slice(1);
                const withHead = getCombinations(tail, k - 1).map(c => [head, ...c]);
                const withoutHead = getCombinations(tail, k);
                return [...withHead, ...withoutHead];
            }

            if (pool.length > 16) {
                pool.sort((a, b) => b.pokerRank - a.pokerRank);
                pool = pool.slice(0, 16);
            }

            const combos = getCombinations(pool, 5);
            let bestCombo = combos[0];
            let bestEval = getPokerHandDetails(bestCombo);
            let bestBaseSum = bestCombo.reduce((sum, c) => sum + c.coinValue, 0);

            for (let i = 1; i < combos.length; i++) {
                const combo = combos[i];
                const evalDetails = getPokerHandDetails(combo);
                const comp = comparePokerHands(evalDetails, bestEval);

                if (comp > 0) {
                    bestCombo = combo;
                    bestEval = evalDetails;
                    bestBaseSum = combo.reduce((sum, c) => sum + c.coinValue, 0);
                } else if (comp === 0) {
                    const baseSum = combo.reduce((sum, c) => sum + c.coinValue, 0);
                    if (baseSum > bestBaseSum) {
                        bestCombo = combo;
                        bestEval = evalDetails;
                        bestBaseSum = baseSum;
                    }
                }
            }

            return bestCombo;
        }

        function App() {
            const [tab, setTab] = useState('game');
            const [coins, setCoins] = useState(1500);
            const [xp, setXp] = useState(0);
            const [level, setLevel] = useState(1);
            const [wins, setWins] = useState(0);
            const [toast, setToast] = useState(null);

            const [activeCards, setActiveCards] = useState(() => generateUniqueHand());

            const [inventory, setInventory] = useState([
                getRandomCard('common'),
                getRandomCard('common'),
                getRandomCard('common'),
                getRandomCard('uncommon'),
                getRandomCard('uncommon')
            ]);

            const [houseHandCards, setHouseHandCards] = useState([]);
            const [playingHand, setPlayingHand] = useState(false);
            const [lastResult, setLastResult] = useState(null);

            const [checkInStreak, setCheckInStreak] = useState(1);
            const [checkedInToday, setCheckedInToday] = useState(false);
            const [tasks, setTasks] = useState([
                { id: 1, title: 'Play 3 Poker Hands', target: 3, progress: 0, reward: 500, claimed: false },
                { id: 2, title: 'Fuse 1 Card Set', target: 1, progress: 0, reward: 800, claimed: false },
                { id: 3, title: 'Win 2 Matches', target: 2, progress: 0, reward: 1200, claimed: false }
            ]);

            const [suitFilter, setSuitFilter] = useState('all');
            const [rarityFilter, setRarityFilter] = useState('all');

            const showToast = (text, type = 'info') => {
                setToast({ text, type });
                setTimeout(() => setToast(null), 3000);
            };

            const passivePerHour = useMemo(() => {
                return activeCards.reduce((acc, card) => {
                    const rarityData = RARITIES.find(r => r.id === card.rarity) || RARITIES[0];
                    return acc + (card.coinValue * rarityData.mult);
                }, 0);
            }, [activeCards]);

            useEffect(() => {
                const interval = setInterval(() => {
                    if (passivePerHour > 0) {
                        const tickReward = Math.max(1, Math.floor(passivePerHour / 720));
                        setCoins(prev => prev + tickReward);
                    }
                }, 5000);
                return () => clearInterval(interval);
            }, [passivePerHour]);

            const playerEval = useMemo(() => {
                return getPokerHandDetails(activeCards);
            }, [activeCards]);

            const equipCardFromInventory = (cardToEquip) => {
                if (activeCards.length >= 5) {
                    showToast('TABLE IS FULL (MAX 5)', 'warning');
                    return;
                }

                const isDuplicateOnTable = activeCards.some(
                    c => c.rankName === cardToEquip.rankName && c.suit === cardToEquip.suit
                );

                if (isDuplicateOnTable) {
                    playSound('lose');
                    showToast(`ALREADY HAVE ${cardToEquip.rankName} OF ${cardToEquip.symbol} ON TABLE!`, 'error');
                    return;
                }

                setInventory(prev => {
                    const idx = prev.findIndex(c => c.id === cardToEquip.id);
                    if (idx === -1) return prev;
                    const next = [...prev];
                    next.splice(idx, 1);
                    return next;
                });

                setActiveCards(prev => [...prev, cardToEquip]);
                playSound('click');
            };

            const unequipCardFromTable = (cardId) => {
                const card = activeCards.find(c => c.id === cardId);
                if (!card) return;

                setActiveCards(prev => prev.filter(c => c.id !== cardId));
                setInventory(prev => [...prev, card]);
                playSound('click');
            };

            const handleAutoFit = () => {
                const allAvailable = [...activeCards, ...inventory];
                if (allAvailable.length < 5) {
                    showToast('NEED AT LEAST 5 CARDS IN TOTAL', 'warning');
                    return;
                }

                const bestFive = findBestHandCombination(allAvailable);
                let pool = [...allAvailable];
                const newTable = [];

                bestFive.forEach(bestCard => {
                    const idx = pool.findIndex(c => c.id === bestCard.id);
                    if (idx !== -1) {
                        newTable.push(pool[idx]);
                        pool.splice(idx, 1);
                    }
                });

                setActiveCards(newTable);
                setInventory(pool);
                playSound('win');
                showToast('AUTO-FIT APPLIED FOR BEST POKER HAND!', 'success');
            };

            const handleFuseCards = (groupKey) => {
                const matchingCards = inventory.filter(c => `${c.rankName}-${c.suit}-${c.rarity}` === groupKey);
                if (matchingCards.length < 3) {
                    showToast('NEED 3 IDENTICAL CARDS TO FUSE', 'warning');
                    return;
                }

                const sampleCard = matchingCards[0];
                const rarityInfo = RARITIES.find(r => r.id === sampleCard.rarity);

                if (!rarityInfo || !rarityInfo.next) {
                    showToast('MYTHIC CARDS CANNOT BE FUSED', 'error');
                    return;
                }

                if (coins < rarityInfo.fuseCost) {
                    showToast(`NOT ENOUGH COINS (${rarityInfo.fuseCost} NEEDED)`, 'error');
                    return;
